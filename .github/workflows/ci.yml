name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AGE_VERSION: v1.3.2

jobs:
  check:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm knip
      # The web app's unit tests run in Node; the engine's need browsers, in their own job.
      - run: pnpm --filter @encryptee/web test

  engine:
    name: Engine tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install age CLI
        run: |
          curl -sSfL -o age.tgz "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          tar xzf age.tgz
          echo "AGE_BIN=$PWD/age" >> "$GITHUB_ENV"
      - run: pnpm --filter @encryptee/engine exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @encryptee/engine test
