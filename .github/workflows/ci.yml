name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AGE_VERSION: v1.3.2
  WRANGLER_SEND_METRICS: 'false'
  # Pull requests reuse cached Vite+ task results; main, which Workers Builds
  # deploys, always runs everything. Only tasks cache, never package.json scripts.
  VP_CACHE: ${{ github.event_name == 'push' && '--no-cache' || '' }}

jobs:
  check:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to v1.22.0 by commit: setup-vp's v1 tag no longer moves.
      - uses: voidzero-dev/setup-vp@0072dab61af1caed438a55cb90c8d6dc0dfa09ce
        with:
          node-version-file: .node-version
          cache: true
      - uses: actions/cache/restore@v6
        if: github.event_name == 'pull_request'
        id: vite-task-cache
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: vp run $VP_CACHE lint
      - run: vp run $VP_CACHE fmt:check
      - run: vp run $VP_CACHE -r typecheck
      - run: vp run $VP_CACHE knip
      # The web app's unit tests run in Node; the engine's need browsers, in their own job.
      - run: vp run $VP_CACHE @encryptee/web#test
      - uses: actions/cache/save@v6
        if: github.event_name == 'pull_request' && success()
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  engine:
    name: Engine tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@0072dab61af1caed438a55cb90c8d6dc0dfa09ce
        with:
          node-version-file: .node-version
          cache: true
      - name: Install age CLI
        run: |
          curl -sSfL -o age.tgz "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          tar xzf age.tgz
          echo "AGE_BIN=$PWD/age" >> "$GITHUB_ENV"
      - run: vp exec --filter @encryptee/engine playwright install --with-deps chromium firefox webkit
      # A package.json script, so never cached: it runs the real age CLI and browsers.
      - run: vp run @encryptee/engine#test

  e2e:
    name: E2E (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@0072dab61af1caed438a55cb90c8d6dc0dfa09ce
        with:
          node-version-file: .node-version
          cache: true
      - uses: actions/cache/restore@v6
        if: github.event_name == 'pull_request'
        id: vite-task-cache
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: vp exec --filter @encryptee/web playwright install --with-deps chromium firefox webkit
      - run: vp run $VP_CACHE @encryptee/web#build
      - run: cp wrangler.example.jsonc wrangler.jsonc
      # A package.json script, so never cached: it serves the build with wrangler.
      - run: vp run @encryptee/web#e2e
      - uses: actions/cache/save@v6
        if: github.event_name == 'pull_request' && success()
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
